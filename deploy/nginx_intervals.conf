# Configuración de Nginx para Intervals Fit Analytics Platform

server {
    listen 80;
    listen [::]:80;
    server_name _; # Reemplazar con tu dominio (ej: intervals.tudominio.com) o dejar _ para responder a la IP pública

    # Tamaño máximo para subida de archivos FIT o batch data
    client_max_body_size 50M;

    # Compresión gzip para agilizar la carga del SPA y respuestas JSON
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Recursos estáticos servidos directamente por Nginx (alta velocidad y menor carga de Python)
    location /static/ {
        alias /var/www/intervals_fit_analytics/web/static/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Proxy hacia el servidor FastAPI (Uvicorn)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Cabeceras estándar para propagar IP real y protocolo
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Soporte para WebSockets si se integran notificaciones en tiempo real
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts amplios para cálculos pesados de telemetría y descargas masivas de FIT
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;

        # Deshabilitar buffering para respuestas de streaming si las hay
        proxy_buffering off;
    }
}
