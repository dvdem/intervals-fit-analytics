version: '3.8'

services:
  intervals-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: intervals_portal
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
      - ../output:/app/output
      - ../assets:/app/assets
      - ../logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
