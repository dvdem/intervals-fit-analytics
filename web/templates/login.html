<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso | Intervals Fit Analytics - Pro Cycling</title>
  <link rel="stylesheet" href="/static/css/style.css?v=2.3">
  <style>
    /* Estilos específicos para la pantalla de Login */
    body.login-body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 15%, var(--body-bg-gradient-1) 0%, transparent 65%),
                  radial-gradient(circle at 80% 85%, var(--body-bg-gradient-2) 0%, transparent 65%),
                  var(--bg-primary);
      position: relative;
      overflow-x: hidden;
    }

    .login-wrapper {
      width: 100%;
      max-width: 440px;
      animation: fadeInLogin 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 2;
    }

    @keyframes fadeInLogin {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-lg);
      box-shadow: 0 24px 48px -12px rgba(15, 23, 42, 0.18), 0 0 0 1px var(--border-subtle);
      padding: 36px 32px;
      backdrop-filter: blur(12px);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple), var(--accent-emerald));
    }

    .login-brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-logo {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent-cyan), #0369a1);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.9rem;
      box-shadow: 0 8px 20px var(--accent-cyan-glow);
      margin-bottom: 14px;
    }

    .login-title {
      font-family: var(--font-heading);
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--text-bright);
      margin: 0 0 6px 0;
      letter-spacing: -0.02em;
    }

    .login-subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin: 0;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .input-with-icon {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-dim);
      font-size: 1.05rem;
      pointer-events: none;
    }

    .input-field {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background: var(--input-bg);
      border: 1.5px solid var(--border-medium);
      border-radius: var(--radius-md);
      font-family: var(--font-main);
      font-size: 0.95rem;
      color: var(--text-bright);
      outline: none;
      transition: var(--transition);
    }

    .input-field:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 4px var(--accent-cyan-glow);
    }

    .toggle-pwd-btn {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 4px 6px;
      font-size: 1.1rem;
      border-radius: var(--radius-sm);
      transition: var(--transition);
    }

    .toggle-pwd-btn:hover {
      color: var(--text-bright);
      background: var(--btn-secondary-hover);
    }

    .btn-login-submit {
      margin-top: 8px;
      width: 100%;
      padding: 13px 20px;
      background: linear-gradient(135deg, var(--accent-cyan), #0284c7);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      font-family: var(--font-main);
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 18px -4px var(--accent-cyan-glow);
      transition: var(--transition);
    }

    .btn-login-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px -4px var(--accent-cyan-glow);
      filter: brightness(1.05);
    }

    .btn-login-submit:active {
      transform: translateY(0);
    }

    .btn-login-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .login-alert {
      display: none;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: 0.86rem;
      line-height: 1.4;
      margin-bottom: 16px;
      animation: alertPop 0.3s ease;
    }

    @keyframes alertPop {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-alert.error {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(225, 29, 72, 0.1);
      border: 1px solid rgba(225, 29, 72, 0.3);
      color: var(--accent-rose);
    }

    .login-footer-roles {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--border-subtle);
      text-align: center;
    }

    .roles-title {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      margin-bottom: 10px;
      font-weight: 600;
    }

    .roles-badges {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .badge-role-pill {
      font-size: 0.74rem;
      padding: 4px 9px;
      border-radius: var(--radius-full);
      font-weight: 500;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .pill-admin {
      background: rgba(2, 132, 199, 0.12);
      color: var(--accent-cyan);
      border-color: rgba(2, 132, 199, 0.3);
    }

    .pill-editor {
      background: rgba(5, 150, 105, 0.12);
      color: var(--accent-emerald);
      border-color: rgba(5, 150, 105, 0.3);
    }

    .pill-visor {
      background: rgba(217, 119, 6, 0.12);
      color: var(--accent-amber);
      border-color: rgba(217, 119, 6, 0.3);
    }

    .theme-toggle-corner {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
    }

    .spinner-login {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="login-body">

  <!-- Botón de cambio de tema en esquina -->
  <div class="theme-toggle-corner">
    <button class="btn btn-secondary btn-sm" id="btn-theme-toggle" title="Cambiar Tema (Claro / Oscuro)">
      <span id="theme-toggle-icon">🌙</span>
      <span id="theme-toggle-text">Modo Oscuro</span>
    </button>
  </div>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-logo">⚡</div>
        <h1 class="login-title">Intervals Fit Analytics</h1>
        <p class="login-subtitle">Plataforma Profesional de Rendimiento Ciclista</p>
      </div>

      <!-- Alerta de Error -->
      <div id="login-alert" class="login-alert" role="alert">
        <span>⚠️</span>
        <span id="login-alert-msg">Credenciales incorrectas.</span>
      </div>

      <!-- Formulario de Login -->
      <form id="login-form" class="login-form" autocomplete="on">
        <div class="input-group">
          <label for="input-username" class="input-label">Usuario</label>
          <div class="input-with-icon">
            <span class="input-icon">👤</span>
            <input
              type="text"
              id="input-username"
              name="username"
              class="input-field"
              placeholder="Ingresa tu usuario (ej: admin)"
              required
              autofocus
            />
          </div>
        </div>

        <div class="input-group">
          <label for="input-password" class="input-label">Contraseña</label>
          <div class="input-with-icon">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="input-password"
              name="password"
              class="input-field"
              placeholder="Ingresa tu contraseña"
              required
            />
            <button type="button" class="toggle-pwd-btn" id="btn-toggle-pwd" title="Mostrar/Ocultar contraseña">
              👁️
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login-submit" id="btn-login-submit">
          <span id="btn-login-text">Iniciar Sesión</span>
          <span id="btn-login-spinner" class="spinner-login" style="display: none;"></span>
        </button>
      </form>

      <!-- Roles Informativos -->
      <!--div class="login-footer-roles">
        <div class="roles-title">Perfiles de Acceso al Sistema</div>
        <div class="roles-badges">
          <span class="badge-role-pill pill-admin">👑 Administrador (Control Total)</span>
          <span class="badge-role-pill pill-editor">✏️ Editor (Gestión de Datos)</span>
          <span class="badge-role-pill pill-visor">👁️ Visor (Solo Lectura)</span>
        </div>
      </div-->
    </div>
  </div>

  <script>
    // Inicialización de Tema Claro / Oscuro
    function initTheme() {
      const savedTheme = localStorage.getItem('intervals_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeUI(savedTheme);
    }

    function updateThemeUI(theme) {
      const icon = document.getElementById('theme-toggle-icon');
      const text = document.getElementById('theme-toggle-text');
      if (theme === 'dark') {
        if (icon) icon.textContent = '☀️';
        if (text) text.textContent = 'Modo Claro';
      } else {
        if (icon) icon.textContent = '🌙';
        if (text) text.textContent = 'Modo Oscuro';
      }
    }

    document.getElementById('btn-theme-toggle')?.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('intervals_theme', next);
      updateThemeUI(next);
    });

    initTheme();

    // Toggle para ver contraseña
    const pwdInput = document.getElementById('input-password');
    const togglePwdBtn = document.getElementById('btn-toggle-pwd');
    togglePwdBtn?.addEventListener('click', () => {
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        togglePwdBtn.textContent = '🙈';
      } else {
        pwdInput.type = 'password';
        togglePwdBtn.textContent = '👁️';
      }
    });

    // Envío del Formulario
    const loginForm = document.getElementById('login-form');
    const alertBox = document.getElementById('login-alert');
    const alertMsg = document.getElementById('login-alert-msg');
    const submitBtn = document.getElementById('btn-login-submit');
    const btnText = document.getElementById('btn-login-text');
    const btnSpinner = document.getElementById('btn-login-spinner');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.className = 'login-alert';
      alertBox.style.display = 'none';

      const username = document.getElementById('input-username').value.trim();
      const password = document.getElementById('input-password').value;

      if (!username || !password) {
        showError('Por favor ingresa tu usuario y contraseña.');
        return;
      }

      setLoading(true);

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok && data.ok) {
          // Sesión exitosa: guardar token en localStorage como fallback
          if (data.token) {
            localStorage.setItem('ifa_token', data.token);
          }
          if (data.user) {
            localStorage.setItem('ifa_user', JSON.stringify(data.user));
          }
          // Redireccionar al dashboard
          window.location.href = '/';
        } else {
          showError(data.detail || 'Usuario o contraseña incorrectos.');
          setLoading(false);
        }
      } catch (err) {
        showError('Error al conectar con el servidor. Intenta nuevamente.');
        setLoading(false);
      }
    });

    function showError(msg) {
      alertMsg.textContent = msg;
      alertBox.className = 'login-alert error';
      alertBox.style.display = 'flex';
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      if (isLoading) {
        btnText.textContent = 'Accediendo...';
        btnSpinner.style.display = 'inline-block';
      } else {
        btnText.textContent = 'Iniciar Sesión';
        btnSpinner.style.display = 'none';
      }
    }
  </script>
</body>
</html>
